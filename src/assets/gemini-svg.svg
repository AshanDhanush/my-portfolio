<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <!-- Deep Space Backdrop matching portfolio color tokens -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060814" />
      <stop offset="100%" stop-color="#0b112c" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.6" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg-grad)" />

  <!-- Architectural Background Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0,60 H800 M0,120 H800 M0,180 H800 M0,240 H800 M0,300 H800 M0,360 H800 M0,420 H800" />
    <path d="M100,0 V480 M200,0 V480 M300,0 V480 M400,0 V480 M500,0 V480 M600,0 V480 M700,0 V480" />
  </g>

  <!-- Ambient Light Emission Effects (Anti-gravity floating lights) -->
  <circle cx="200" cy="150" r="120" fill="#a78bfa" opacity="0.08" filter="url(#blur-glow)" />
  <circle cx="600" cy="300" r="140" fill="#22d3ee" opacity="0.06" filter="url(#blur-glow)" />

  <!-- Floating Glassmorphic System Window -->
  <g transform="translate(100, 60)">
    <!-- Card Shadow & Drop Glow -->
    <rect width="600" height="360" rx="24" fill="#000000" opacity="0.4" transform="translate(0, 15)" filter="url(#blur-glow)" />
    
    <!-- Glass Panel Background -->
    <rect width="600" height="360" rx="24" fill="#0f172a" fill-opacity="0.45" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    
    <!-- Neon Top Accent Trim Line -->
    <path d="M 24 0 L 200 0" stroke="url(#accent-glow)" stroke-width="3" stroke-linecap="round" />

    <!-- Sidebar Layout Navigation Grid Mockup -->
    <line x1="160" y1="0" x2="160" y2="360" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
    
    <!-- Window Controls Mockup -->
    <circle cx="30" cy="25" r="5" fill="#ef4444" opacity="0.7" />
    <circle cx="45" cy="25" r="5" fill="#f59e0b" opacity="0.7" />
    <circle cx="60" cy="25" r="5" fill="#10b981" opacity="0.7" />

    <!-- Sidebar Navigation Links -->
    <rect x="25" y="70" width="110" height="24" rx="6" fill="rgba(34, 211, 238, 0.1)" stroke="rgba(34, 211, 238, 0.2)" />
    <circle cx="40" cy="82" r="4" fill="#22d3ee" />
    <rect x="54" y="78" width="60" height="8" rx="4" fill="#22d3ee" opacity="0.8" />
    
    <rect x="25" y="110" width="110" height="24" rx="6" fill="transparent" />
    <circle cx="40" cy="122" r="4" fill="#64748b" />
    <rect x="54" y="118" width="50" height="8" rx="4" fill="#64748b" />

    <rect x="25" y="150" width="110" height="24" rx="6" fill="transparent" />
    <circle cx="40" cy="162" r="4" fill="#64748b" />
    <rect x="54" y="158" width="55" height="8" rx="4" fill="#64748b" />

    <!-- Main Workspace Dashboard Content -->
    <!-- Large Header Data Card -->
    <rect x="185" y="35" width="390" height="80" rx="16" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="210" y="70" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">HealthSync</text>
    <text x="210" y="92" font-family="monospace" font-size="11" fill="#64748b" letter-spacing="1">v1.0.0 // SMART APPOINTMENT ENGINE</text>
    
    <!-- Heartbeat Pulse Line inside Header Card -->
    <path d="M 430 75 L 460 75 L 466 60 L 472 90 L 478 50 L 484 85 L 490 75 L 550 75" 
          fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.8" />

    <!-- Grid: Data Analytics Widgets -->
    <!-- Scheduling Performance Module -->
    <rect x="185" y="135" width="185" height="195" rx="16" fill="rgba(15, 23, 42, 0.4)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="205" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">Queue Optimization</text>
    
    <!-- Decorative Analytical Circle Graphic -->
    <circle cx="277" cy="235" r="45" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="8" />
    <path d="M 277 190 A 45 45 0 1 1 235 250" fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <text x="277" y="240" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">94%</text>

    <!-- Channel Performance List Module -->
    <rect x="390" y="135" width="185" height="195" rx="16" fill="rgba(15, 23, 42, 0.4)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="410" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22d3ee">Patient Registry Status</text>
    
    <!-- Dynamic Simulated Registry Line Rows -->
    <rect x="410" y="190" width="145" height="32" rx="8" fill="rgba(255,255,255,0.02)" />
    <circle cx="426" cy="206" r="6" fill="#22d3ee" opacity="0.7" />
    <rect x="442" y="202" width="80" height="8" rx="4" fill="#cbd5e1" opacity="0.9" />

    <rect x="410" y="232" width="145" height="32" rx="8" fill="rgba(255,255,255,0.02)" />
    <circle cx="426" cy="248" r="6" fill="#a78bfa" opacity="0.7" />
    <rect x="442" y="244" width="65" height="8" rx="4" fill="#cbd5e1" opacity="0.9" />

    <rect x="410" y="274" width="145" height="32" rx="8" fill="rgba(255,255,255,0.02)" />
    <circle cx="426" cy="290" r="6" fill="#38bdf8" opacity="0.7" />
    <rect x="442" y="286" width="75" height="8" rx="4" fill="#cbd5e1" opacity="0.9" />
  </g>
</svg>
